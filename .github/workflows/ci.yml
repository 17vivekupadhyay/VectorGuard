name: VectorGuard CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall vectorguard

      - name: Run VectorGuard against safe mock chatbot
        run: |
          MOCK_MODE=safe python vectorguard/examples/mock_chatbot.py &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" || true
          }
          trap cleanup EXIT

          READY=0
          for i in {1..20}; do
            if curl --fail --silent --show-error -X POST http://localhost:8000/chat \
              -H "Content-Type: application/json" \
              -d '{"message":"hello"}'; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Safe mock chatbot did not start"
            exit 1
          fi

          python -m vectorguard.cli \
            --target vectorguard/examples/http_target.yaml \
            --tests vectorguard/tests/rag_injection.yaml \
            --fail-on-findings

      - name: Confirm VectorGuard detects vulnerable mock chatbot
        run: |
          MOCK_MODE=vulnerable python vectorguard/examples/mock_chatbot.py &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" || true
          }
          trap cleanup EXIT

          READY=0
          for i in {1..20}; do
            if curl --fail --silent --show-error -X POST http://localhost:8000/chat \
              -H "Content-Type: application/json" \
              -d '{"message":"hello"}'; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Vulnerable mock chatbot did not start"
            exit 1
          fi

          set +e
          python -m vectorguard.cli \
            --target vectorguard/examples/http_target.yaml \
            --tests vectorguard/tests/rag_injection.yaml \
            --fail-on-findings
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "Expected VectorGuard to detect findings, but it exited successfully."
            exit 1
          fi

          echo "VectorGuard correctly detected vulnerable mock behavior."